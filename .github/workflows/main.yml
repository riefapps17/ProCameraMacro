name: Build ProCamera RAW APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug & Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: 4. Install Android SDK Platform 36 & Build-Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || sdkmanager "platforms;android-36"

      - name: 5. Prepare Signing Keystore & Environment Config
        run: |
          # Restore debug.keystore from debug.keystore.base64 if available, otherwise generate standard debug.keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: 6. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 7. Build Debug APK (ProCamera RAW & Macro)
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: 8. Rename Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ProCamera-RAW-Macro-Debug.apk
          ls -lh app/build/outputs/apk/debug/

      - name: 9. Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ProCamera-RAW-Macro-APK
          path: |
            app/build/outputs/apk/debug/ProCamera-RAW-Macro-Debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
